common:
  log_media: stdout
  log_level: info
  working_dir: /data/crowdsec
config_paths:
  config_dir: /etc/crowdsec
  data_dir: /var/lib/crowdsec/data
  simulation_path: /etc/crowdsec/simulation.yaml
  hub_dir: /etc/crowdsec/hub
  index_path: /etc/crowdsec/hub/.index.json
  notification_dir: /etc/crowdsec/notifications
  plugin_dir: /usr/local/lib/crowdsec/plugins
crowdsec_service:
  acquisition_path: /opt/web-edge/acquis.yaml
  parser_routines: 1
cscli:
  output: human
db_config:
  type: sqlite
  db_path: /data/crowdsec/crowdsec.db
  use_wal: true
  flush:
    max_items: 5000
    max_age: 7d
api:
  client:
    credentials_path: /data/crowdsec/credentials.yaml
  server:
    listen_uri: 127.0.0.1:8081
    profiles_path: /etc/crowdsec/profiles.yaml
    trusted_ips: [127.0.0.1, '::1']
prometheus:
  enabled: true
  level: full
  listen_addr: 127.0.0.1
  listen_port: 6060
